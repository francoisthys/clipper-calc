<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLIPPER Calc">
<title>CLIPPER — Calculateur Vitrages</title>
<style>
:root {
  --bg: #0a0e17; --bg2: #111827; --bg3: #1f2937; --border: #1e293b;
  --text: #c8d3e0; --text2: #9ca3af; --text3: #6b7280;
  --accent: #f59e0b; --accent2: #92400e;
  --blue: #60a5fa; --blue2: #1e3a5f; --blue3: #93c5fd;
  --green: #4ade80; --green2: #052e16; --green3: #166534;
  --orange: #fb923c; --red: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); font-size: 13px; }
input, select, button { font-family: inherit; font-size: 13px; }
input[type=number], input[type=text] {
  background: var(--bg2); border: 1px solid var(--border); color: #e2e8f0;
  padding: 7px 6px; border-radius: 4px; width: 100%; text-align: right;
}
input[type=number]:focus, input[type=text]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(245,158,11,0.15); }
input[type=text] { text-align: left; }
.inp-green { border-color: var(--green3) !important; background: var(--green2) !important; color: var(--green) !important; }
.calc-cell { background: #0c1a2e; border: 1px solid var(--blue2); color: var(--blue); padding: 7px 6px; border-radius: 4px; font-weight: 700; text-align: right; }
.calc-warn { color: var(--accent) !important; border-color: var(--accent2) !important; background: #1c1206 !important; }
select { background: var(--bg2); border: 1px solid var(--border); color: #e2e8f0; padding: 5px 2px; border-radius: 4px; text-align: center; width: 100%; cursor: pointer; }
select:focus { border-color: var(--accent); outline: none; }
.btn { padding: 8px 14px; border: 1px solid #374151; border-radius: 5px; background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.btn:hover { background: var(--bg3); color: #e2e8f0; }
.btn:active { transform: scale(0.97); }
.btn-a { border-color: var(--accent2); color: var(--accent); }
.btn-a:hover { background: #1c1206; }
.btn-d { border-color: #7f1d1d; color: #f87171; }
.btn-d:hover { background: #1c0606; }
.btn-export { background: linear-gradient(135deg,#065f46,#047857); border: 1px solid #10b981; color: #ecfdf5; font-weight: 600; padding: 10px 18px; }
.btn-export:hover { box-shadow: 0 0 16px rgba(16,185,129,0.2); }
header { background: linear-gradient(180deg,var(--bg2),var(--bg)); border-bottom: 1px solid var(--border); padding: 16px; }
.hdr-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; max-width: 1300px; margin: 0 auto; }
.hdr-title { display: flex; align-items: center; gap: 8px; }
.hdr-title .bar { width: 6px; height: 28px; background: linear-gradient(180deg,var(--accent),#d97706); border-radius: 2px; }
.hdr-title h1 { font-size: 18px; color: #f1f5f9; letter-spacing: -0.5px; }
.hdr-title h1 span { color: var(--accent); }
.hdr-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
.hdr-proj { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; max-width: 1300px; margin-left: auto; margin-right: auto; }
.hdr-proj label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 3px; }
.hdr-btns { display: flex; gap: 6px; }
.params { margin-top: 12px; padding: 14px; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; max-width: 1300px; margin-left: auto; margin-right: auto; display: none; }
.params-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.params-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.param-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
.param-box label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); display: block; margin-bottom: 4px; }
.param-box input { font-size: 15px; font-weight: 700; color: var(--accent); background: var(--bg); border-color: var(--accent2); }
.param-box .unit { font-size: 10px; color: #4b5563; margin-top: 3px; }
main { max-width: 1300px; margin: 0 auto; padding: 12px 16px 80px; }
.zone { margin-bottom: 20px; }
.zone-hdr { background: linear-gradient(135deg,var(--blue2),#172554); border: 1px solid #1e40af; border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; flex-wrap: wrap; }
.zone-hdr .zbar { width: 5px; height: 24px; background: #3b82f6; border-radius: 2px; flex-shrink: 0; }
.zone-hdr input[type=text] { background: transparent; border: 1px solid var(--blue2); color: var(--blue3); font-size: 13px; padding: 4px 8px; }
.zone-hdr .zname { width: 110px; font-weight: 700; font-size: 14px; }
.zone-hdr .zdesc { flex: 1; min-width: 120px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 920px; }
thead th { background: var(--bg2); color: var(--text3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; padding: 8px 4px; text-align: center; position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--border); }
tbody td { padding: 4px 3px; vertical-align: middle; border-bottom: 1px solid #0f1724; }
.row-first td { border-top: 1px solid var(--border); padding-top: 8px; }
.zone-tot { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; margin-top: 3px; padding: 8px; display: flex; justify-content: flex-end; gap: 16px; align-items: center; font-weight: 600; font-size: 12px; flex-wrap: wrap; }
.zone-tot .lbl { color: var(--blue); text-transform: uppercase; font-size: 10px; }
.zone-tot .val { color: var(--blue3); }
.grand-tot { background: linear-gradient(135deg,#7c2d12,#991b1b); border: 1px solid var(--red); border-radius: 8px; padding: 14px 18px; margin-top: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.grand-tot .gt-title { font-size: 16px; font-weight: 700; color: #fef2f2; }
.grand-tot .gt-item { text-align: center; }
.grand-tot .gt-item .gt-label { font-size: 10px; color: #fca5a5; text-transform: uppercase; }
.grand-tot .gt-item .gt-val { font-size: 20px; font-weight: 700; color: #fef2f2; }
.grand-tot .gt-unit { font-size: 11px; color: #fca5a5; }
.gt-sep { width: 1px; height: 36px; background: var(--red); }
@media(max-width:700px) {
  .params-grid { grid-template-columns: 1fr 1fr; }
  .hdr-proj { grid-template-columns: 1fr; }
  .grand-tot { flex-direction: column; text-align: center; }
  .gt-sep { width: 60px; height: 1px; }
  table { font-size: 11px; }
}
</style>
</head>
<body>
<header>
  <div class="hdr-top">
    <div>
      <div class="hdr-title"><div class="bar"></div><h1>CLIPPER <span>INFLUENCE</span></h1></div>
      <div class="hdr-sub">Calculateur de commande vitrages — Hors-ligne</div>
    </div>
    <div class="hdr-btns">
      <button class="btn btn-a" onclick="toggleParams()">⚙ Paramètres</button>
      <button class="btn btn-export" onclick="exportCSV()">↓ Export CSV</button>
    </div>
  </div>
  <div class="hdr-proj">
    <div><label>Projet</label><input type="text" id="projName" value="BME (Verviers - BEL)"></div>
    <div><label>Adresse livraison</label><input type="text" id="projAddr" value="Avenue Mercury, B-4800 Verviers"></div>
  </div>
  <div class="params" id="paramsPanel">
    <div class="params-title">PARAMÈTRES SYSTÈME CLIPPER</div>
    <div class="params-grid">
      <div class="param-box"><label>Aisance largeur</label><input type="number" id="pAisL" value="18" onchange="render()"><div class="unit">mm (9mm × 2 côtés)</div></div>
      <div class="param-box"><label>Joint entre vitrages</label><input type="number" id="pJoint" value="2" onchange="render()"><div class="unit">mm</div></div>
      <div class="param-box"><label>Aisance hauteur</label><input type="number" id="pAisH" value="20" onchange="render()"><div class="unit">mm (10mm × 2 côtés)</div></div>
      <div class="param-box"><label>Largeur max vitrage</label><input type="number" id="pMaxL" value="1200" onchange="render()"><div class="unit">mm</div></div>
    </div>
  </div>
</header>
<main id="main"></main>
<script>
var uid = 0;
function gid() { return "u" + (++uid); }
function mkGlass(idx, h) { return { id: gid(), idx: idx, hautCDV: h || 0 }; }
function mkCloison(n) { return { id: gid(), num: String(n), desc: "", largCDV: 0, hautMoy: 0, vitrage: "double", ep1: 10, ep2: 12, glasses: [mkGlass(1, 0)] }; }
function mkZone(n, name, desc) { return { id: gid(), name: name || "ZONE " + n, desc: desc || "", cloisons: [mkCloison(1)] }; }

var zones = [mkZone(1, "ZONE 1", "Open Space")];

function getP() {
  return {
    aisL: +document.getElementById("pAisL").value || 18,
    joint: +document.getElementById("pJoint").value || 2,
    aisH: +document.getElementById("pAisH").value || 20,
    maxL: +document.getElementById("pMaxL").value || 1200
  };
}
function calcNb(w, mx, j) { if (!w || w <= 0) return 1; var n = 1; while ((w - (n-1)*j)/n > mx) n++; return n; }
function calcLV(w, nb, j, a) { if (!w || !nb) return 0; return Math.round(((w - (nb-1)*j)/nb + a)*10)/10; }
function calcHV(h, a) { return (h||0) + a; }
function esc(s) { return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function toggleParams() { var el = document.getElementById("paramsPanel"); el.style.display = el.style.display === "none" ? "block" : "none"; }

function chgLarg(zi, ci, val) {
  var p = getP(), c = zones[zi].cloisons[ci]; c.largCDV = val;
  var nb = calcNb(val, p.maxL, p.joint), ng = [];
  for (var i = 0; i < nb; i++) ng.push(c.glasses[i] ? {id:c.glasses[i].id, idx:i+1, hautCDV:c.glasses[i].hautCDV} : mkGlass(i+1, c.hautMoy));
  c.glasses = ng; render();
}
function chgNb(zi, ci, val) {
  var c = zones[zi].cloisons[ci], nb = Math.max(1, val), ng = [];
  for (var i = 0; i < nb; i++) ng.push(c.glasses[i] ? {id:c.glasses[i].id, idx:i+1, hautCDV:c.glasses[i].hautCDV} : mkGlass(i+1, c.hautMoy));
  c.glasses = ng; render();
}
function chgHaut(zi, ci, gi, val) {
  var c = zones[zi].cloisons[ci];
  if (gi === 0) { c.hautMoy = val; for (var i = 0; i < c.glasses.length; i++) c.glasses[i].hautCDV = val; }
  else c.glasses[gi].hautCDV = val;
  render();
}
function chgType(zi, ci, val) { zones[zi].cloisons[ci].vitrage = val; render(); }
function chgEp1(zi, ci, val) { zones[zi].cloisons[ci].ep1 = +val; render(); }
function chgEp2(zi, ci, val) { zones[zi].cloisons[ci].ep2 = +val; render(); }
function addCloison(zi) { var z = zones[zi]; z.cloisons.push(mkCloison(z.cloisons.length+1)); render(); }
function remCloison(zi, ci) { zones[zi].cloisons.splice(ci, 1); render(); }
function addZone() { zones.push(mkZone(zones.length+1)); render(); }
function removeZone(zi) { zones.splice(zi, 1); render(); }

function selOpts(vals, sel) { return vals.map(function(v){return '<option value="'+v+'"'+(v===sel?' selected':'')+'>'+v+'</option>';}).join(""); }

function render() {
  var p = getP(), h = "", tQ8=0, tQ10=0, tQ12=0, tSurf=0;
  for (var zi = 0; zi < zones.length; zi++) {
    var z = zones[zi], zQ8=0, zQ10=0, zQ12=0, zSurf=0;
    h += '<div class="zone">';
    h += '<div class="zone-hdr"><div class="zbar"></div>';
    h += '<input type="text" class="zname" value="'+esc(z.name)+'" onchange="zones['+zi+'].name=this.value">';
    h += '<span style="color:#3b82f6">—</span>';
    h += '<input type="text" class="zdesc" value="'+esc(z.desc)+'" placeholder="Description zone..." onchange="zones['+zi+'].desc=this.value">';
    h += '<button class="btn btn-a" onclick="addCloison('+zi+')">+ Cloison</button>';
    if (zones.length > 1) h += '<button class="btn btn-d" onclick="removeZone('+zi+')">✕</button>';
    h += '</div>';
    h += '<div class="tbl"><table><thead><tr>';
    h += '<th style="width:36px">N°</th><th style="min-width:140px">Description</th><th style="width:50px">Type</th><th style="width:84px">Épaisseurs</th>';
    h += '<th style="width:90px">Larg. CDV</th><th style="width:52px">Nb</th><th style="width:36px">N°v</th><th style="width:90px">Haut. CDV</th>';
    h += '<th style="width:100px">Larg. cmd</th><th style="width:100px">Haut. cmd</th>';
    h += '<th style="width:38px">8mm</th><th style="width:38px">10mm</th><th style="width:38px">12mm</th>';
    h += '<th style="width:76px">Surf. m²</th><th style="width:28px"></th></tr></thead><tbody>';

    for (var ci = 0; ci < z.cloisons.length; ci++) {
      var c = z.cloisons[ci], nb = c.glasses.length;
      var lv = calcLV(c.largCDV, nb, p.joint, p.aisL), warn = lv > p.maxL;
      var dv = c.vitrage === "double", npanes = dv ? 2 : 1;
      var q8 = (c.ep1===8?1:0)+(dv&&c.ep2===8?1:0);
      var q10 = (c.ep1===10?1:0)+(dv&&c.ep2===10?1:0);
      var q12 = (c.ep1===12?1:0)+(dv&&c.ep2===12?1:0);

      for (var gi = 0; gi < c.glasses.length; gi++) {
        var g = c.glasses[gi], hv = calcHV(g.hautCDV, p.aisH);
        var surf = (c.largCDV && g.hautCDV) ? Math.round((lv*hv/1e6)*npanes*1000)/1000 : 0;
        zQ8 += q8; zQ10 += q10; zQ12 += q12; zSurf += surf;
        h += '<tr'+(gi===0?' class="row-first"':'')+'>';
        if (gi === 0) {
          h += '<td style="text-align:center;font-weight:700" rowspan="'+nb+'">'+esc(c.num)+'</td>';
          h += '<td rowspan="'+nb+'"><div style="display:flex;gap:3px">';
          h += '<input type="text" value="'+esc(c.num)+'" style="width:34px;text-align:center" onchange="zones['+zi+'].cloisons['+ci+'].num=this.value;render()">';
          h += '<input type="text" value="'+esc(c.desc)+'" placeholder="Description..." style="flex:1" onchange="zones['+zi+'].cloisons['+ci+'].desc=this.value">';
          h += '</div></td>';
          h += '<td rowspan="'+nb+'"><select style="color:'+(dv?'var(--blue)':'var(--orange)')+'" onchange="chgType('+zi+','+ci+',this.value)">';
          h += '<option value="double"'+(dv?' selected':'')+'>DV</option><option value="simple"'+(!dv?' selected':'')+'>SV</option></select></td>';
          h += '<td rowspan="'+nb+'"><div style="display:flex;gap:2px;align-items:center">';
          h += '<select onchange="chgEp1('+zi+','+ci+',this.value)">'+selOpts([8,10,12],c.ep1)+'</select>';
          if (dv) h += '<span style="color:#4b5563;font-size:10px">+</span><select onchange="chgEp2('+zi+','+ci+',this.value)">'+selOpts([8,10,12],c.ep2)+'</select>';
          h += '</div></td>';
          h += '<td rowspan="'+nb+'"><input type="number" class="inp-green" value="'+(c.largCDV||'')+'" onchange="chgLarg('+zi+','+ci+',+this.value)"></td>';
          h += '<td rowspan="'+nb+'"><input type="number" value="'+nb+'" min="1" style="text-align:center" onchange="chgNb('+zi+','+ci+',+this.value)"></td>';
        }
        h += '<td style="text-align:center;font-size:11px;color:var(--text3)">'+g.idx+'</td>';
        h += '<td><input type="number" class="inp-green" value="'+(g.hautCDV||'')+'" onchange="chgHaut('+zi+','+ci+','+gi+',+this.value)"></td>';
        h += '<td><div class="calc-cell'+(warn?' calc-warn':'')+'">'+(c.largCDV?lv.toFixed(1):'—')+'</div></td>';
        h += '<td><div class="calc-cell">'+(g.hautCDV?hv:'—')+'</div></td>';
        h += '<td style="text-align:center;color:'+(q8?'#e2e8f0':'#1a1a2e')+'">'+(q8||'')+'</td>';
        h += '<td style="text-align:center;color:'+(q10?'#e2e8f0':'#1a1a2e')+'">'+(q10||'')+'</td>';
        h += '<td style="text-align:center;color:'+(q12?'#e2e8f0':'#1a1a2e')+'">'+(q12||'')+'</td>';
        h += '<td style="text-align:right;font-size:12px;color:var(--text2)">'+(surf?surf.toFixed(3):'—')+'</td>';
        if (gi === 0) {
          h += '<td rowspan="'+nb+'" style="text-align:center">';
          if (z.cloisons.length > 1) h += '<button class="btn btn-d" style="padding:2px 5px;font-size:10px" onclick="remCloison('+zi+','+ci+')">✕</button>';
          h += '</td>';
        }
        h += '</tr>';
      }
    }
    h += '</tbody></table></div>';
    h += '<div class="zone-tot"><span class="lbl">Total '+esc(z.name)+'</span>';
    if (zQ8) h += '<span class="val">'+zQ8+'×8mm</span>';
    if (zQ10) h += '<span class="val">'+zQ10+'×10mm</span>';
    if (zQ12) h += '<span class="val">'+zQ12+'×12mm</span>';
    h += '<span class="val" style="font-weight:700">'+zSurf.toFixed(3)+' m²</span></div></div>';
    tQ8 += zQ8; tQ10 += zQ10; tQ12 += zQ12; tSurf += zSurf;
  }
  h += '<button class="btn btn-a" style="margin:8px 0 16px" onclick="addZone()">+ Ajouter une zone</button>';
  h += '<div class="grand-tot"><div class="gt-title">TOTAL GÉNÉRAL</div>';
  if (tQ8) h += '<div class="gt-item"><div class="gt-label">Pièces 8mm</div><div class="gt-val">'+tQ8+'</div></div>';
  if (tQ10) h += '<div class="gt-item"><div class="gt-label">Pièces 10mm</div><div class="gt-val">'+tQ10+'</div></div>';
  if (tQ12) h += '<div class="gt-item"><div class="gt-label">Pièces 12mm</div><div class="gt-val">'+tQ12+'</div></div>';
  h += '<div class="gt-sep"></div>';
  h += '<div class="gt-item"><div class="gt-label">Total pièces</div><div class="gt-val">'+(tQ8+tQ10+tQ12)+'</div></div>';
  h += '<div class="gt-item"><div class="gt-label">Surface totale</div><div class="gt-val">'+tSurf.toFixed(3)+' <span class="gt-unit">m²</span></div></div></div>';
  document.getElementById("main").innerHTML = h;
}

function exportCSV() {
  var p = getP(), sep = ";", lines = [];
  function e(v) { var s = String(v==null?"":v); return (s.indexOf(sep)>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  function row() { var a=[]; for(var i=0;i<arguments.length;i++) a.push(e(arguments[i])); lines.push(a.join(sep)); }
  row("COMMANDE VITRAGES - SYSTEME CLIPPER (INFLUENCE)");
  row("Projet : " + document.getElementById("projName").value);
  row("Adresse : " + document.getElementById("projAddr").value);
  row("Date : " + new Date().toLocaleDateString("fr-BE"));
  row(); row("Aisance L:"+p.aisL+"mm","Joint:"+p.joint+"mm","Aisance H:"+p.aisH+"mm","Max L:"+p.maxL+"mm"); row();
  var gQ8=0,gQ10=0,gQ12=0;
  for (var zi=0;zi<zones.length;zi++) {
    var z=zones[zi]; row(z.name+" - "+z.desc);
    row("N°","Description","Type","Épaisseurs","Larg CDV","Nb vit","N° verre","Haut CDV","Larg cmd","Haut cmd","Qté 8mm","Qté 10mm","Qté 12mm","Surface m²");
    var zQ8=0,zQ10=0,zQ12=0,zS=0;
    for (var ci=0;ci<z.cloisons.length;ci++) {
      var c=z.cloisons[ci],nb=c.glasses.length,lv=calcLV(c.largCDV,nb,p.joint,p.aisL);
      var dv=c.vitrage==="double",np=dv?2:1;
      var q8=(c.ep1===8?1:0)+(dv&&c.ep2===8?1:0),q10=(c.ep1===10?1:0)+(dv&&c.ep2===10?1:0),q12=(c.ep1===12?1:0)+(dv&&c.ep2===12?1:0);
      for (var gi=0;gi<c.glasses.length;gi++) {
        var g=c.glasses[gi],hv=calcHV(g.hautCDV,p.aisH),surf=Math.round((lv*hv/1e6)*np*1000)/1000;
        var epL=dv?c.ep1+"+"+c.ep2+"mm":c.ep1+"mm";
        row(gi===0?c.num:"",gi===0?c.desc:"",gi===0?(dv?"DV":"SV"):"",gi===0?epL:"",gi===0?c.largCDV:"",gi===0?nb:"",g.idx,g.hautCDV,lv,hv,q8,q10,q12,surf);
        zQ8+=q8;zQ10+=q10;zQ12+=q12;zS+=surf;
      }
    }
    row("","","","","","","","TOTAL "+z.name,"","",zQ8,zQ10,zQ12,Math.round(zS*1000)/1000); row();
    gQ8+=zQ8;gQ10+=zQ10;gQ12+=zQ12;
  }
  row("","","","","","","","TOTAL GENERAL","","",gQ8,gQ10,gQ12,"");
  var blob = new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="Commande_CLIPPER_"+document.getElementById("projName").value.replace(/[^a-zA-Z0-9]/g,"_")+".csv";
  a.click(); URL.revokeObjectURL(a.href);
}

render();
