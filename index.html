<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Worksphere">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>worksphere - Calculateur vitrages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
@font-face{font-family:'Gilroy';font-weight:800;src:local('Gilroy-ExtraBold'),local('Inter');font-display:swap}
:root{--bg:#f5f7f7;--bg2:#fff;--bg3:#eef1f1;--border:#dce2e2;--text:#1a2e2e;--text2:#4a6060;--text3:#8a9e9e;--ws:#2b6e6e;--ws2:#1a5252;--ws3:#3a8a8a;--ws4:#e8f4f4;--green:#059669;--green-bg:#ecfdf5;--green-bdr:#86efac;--orange:#c2730a;--red:#c53030;--calc-bg:#e8f4f4;--calc-bdr:#a8d4d4;--calc-text:#1a5252}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
input,select,button{font-family:inherit;font-size:13px}
input[type=number],input[type=text]{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:6px;width:100%;text-align:right;transition:all .2s}
input[type=number]:focus,input[type=text]:focus{border-color:var(--ws);outline:none;box-shadow:0 0 0 3px rgba(43,110,110,.12)}
input[type=text]{text-align:left}
.inp-green{border-color:var(--green-bdr)!important;background:var(--green-bg)!important;color:#065f46!important;font-weight:500}
.calc-cell{background:var(--calc-bg);border:1px solid var(--calc-bdr);color:var(--calc-text);padding:7px 8px;border-radius:6px;font-weight:600;text-align:right}
.calc-warn{color:var(--orange)!important;border-color:#fbbf24!important;background:#fffbeb!important}
.inp-hwarn{border-color:#fbbf24!important;background:#fffbeb!important;color:#92400e!important}
.inp-herr{border-color:#f87171!important;background:#fef2f2!important;color:#991b1b!important}
.warn-tip{font-size:10px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;padding:2px 6px;border-radius:4px;margin-top:2px;display:block;line-height:1.3}
.warn-tip.err{color:#991b1b;background:#fef2f2;border-color:#fecaca}
select{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 4px;border-radius:6px;text-align:center;width:100%;cursor:pointer;font-weight:500}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn:hover{background:var(--bg3);color:var(--text)}.btn:active{transform:scale(.97)}
.btn-ws{border-color:var(--ws);color:var(--ws)}.btn-ws:hover{background:var(--ws4)}
.btn-d{border-color:#fca5a5;color:var(--red);font-size:11px}.btn-d:hover{background:#fef2f2}
.btn-export{background:var(--ws);border:1px solid var(--ws2);color:#fff;font-weight:600;padding:10px 18px;border-radius:8px}.btn-export:hover{background:var(--ws2)}
.btn-pdf{background:#b91c1c;border:1px solid #991b1b;color:#fff;font-weight:600;padding:10px 18px;border-radius:8px}.btn-pdf:hover{background:#991b1b}
.brand-bar{background:var(--ws2);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand-logo{height:32px;width:auto}
.brand-name{font-family:'Gilroy','Inter',sans-serif;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
.brand-dot{font-family:'Gilroy','Inter',sans-serif;color:var(--ws3);font-size:24px;font-weight:800}
.brand-base{font-size:10px;color:rgba(255,255,255,.45);margin-top:2px}
.brand-right{font-size:10px;color:rgba(255,255,255,.5)}
.hdr-content{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.hdr-inner{max-width:1340px;margin:0 auto}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-title h1{font-family:'Gilroy','Inter',sans-serif;font-size:17px;color:var(--text);font-weight:800}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:2px}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap}
.hdr-proj{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.hdr-proj label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px;font-weight:600}
.config-bar{margin-top:14px;padding:14px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.config-item{display:flex;flex-direction:column;gap:4px}
.config-item label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.config-item select,.config-item input{font-size:13px;padding:8px 10px;border-radius:6px;font-weight:600}
.profile-sel{min-width:180px;color:var(--ws2)!important;font-weight:700!important}
.joint-sel{width:86px}.maxl-inp{width:76px;font-weight:700!important;color:var(--ws)!important}
.config-info{font-size:11px;padding:6px 0;display:flex;gap:12px;flex-wrap:wrap}
.config-info span{background:var(--ws4);color:var(--ws2);padding:3px 8px;border-radius:4px;font-weight:600;font-size:11px}
main{max-width:1340px;margin:0 auto;padding:20px 24px 80px}
.zone{margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.zone-hdr{background:linear-gradient(135deg,var(--ws2),var(--ws));padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.zone-hdr .zbar{width:4px;height:22px;background:rgba(255,255,255,.5);border-radius:2px}
.zone-hdr input[type=text]{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;padding:5px 10px;border-radius:6px}
.zone-hdr input::placeholder{color:rgba(255,255,255,.35)}
.zone-hdr .zname{width:120px;font-weight:700;font-size:14px}.zone-hdr .zdesc{flex:1;min-width:120px}
.zbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}
.zbtn:hover{background:rgba(255,255,255,.22)}
.zdel{border-color:rgba(255,150,150,.4)!important;color:#ffb3b3!important}
.zsep{color:rgba(255,255,255,.3)}
.zone-body{padding:6px 12px 12px}.tbl{overflow-x:auto}
.com-chk{width:15px;height:15px;cursor:pointer;accent-color:var(--ws)}
.com-row td{background:#f8fbfb;border-bottom:1px solid var(--border);padding:4px 6px!important}
.com-inp{width:100%;border:1px solid var(--calc-bdr);background:var(--calc-bg);color:var(--calc-text);padding:6px 10px;border-radius:6px;font-size:12px;font-style:italic}
.com-inp:focus{border-color:var(--ws);outline:none;box-shadow:0 0 0 3px rgba(43,110,110,.12)}
.com-label{font-size:10px;color:var(--text3);margin-right:8px;font-weight:600;white-space:nowrap}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1060px}
thead th{background:var(--bg3);color:var(--text3);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;padding:10px 4px;text-align:center;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--border);font-weight:700}
tbody td{padding:5px 3px;vertical-align:middle;border-bottom:1px solid #f0f3f3}
.row-first td{border-top:2px solid var(--border);padding-top:10px}
.zone-tot{background:var(--bg3);border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:flex-end;gap:18px;align-items:center;font-weight:600;font-size:12px;flex-wrap:wrap}
.zone-tot .lbl{color:var(--ws);text-transform:uppercase;font-size:10px;font-weight:700}
.zone-tot .val{color:var(--ws2);font-weight:700}
.grand-tot{background:linear-gradient(135deg,var(--ws2),var(--ws));border-radius:12px;padding:18px 24px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;box-shadow:0 4px 16px rgba(43,110,110,.25)}
.gt-title{font-family:'Gilroy','Inter',sans-serif;font-size:16px;font-weight:800;color:#fff}
.gt-item{text-align:center}
.gt-label{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:2px}
.gt-val{font-family:'Gilroy','Inter',sans-serif;font-size:24px;font-weight:800;color:#fff}
.gt-unit{font-size:12px;color:rgba(255,255,255,.45)}.gt-sep{width:1px;height:40px;background:rgba(255,255,255,.15)}
.footer{text-align:center;padding:24px;font-size:10px;color:var(--text3)}.footer a{color:var(--ws);text-decoration:none;font-weight:600}
.btn-proj{background:var(--bg2);border:1px solid var(--ws);color:var(--ws);font-weight:600;padding:10px 18px;border-radius:8px}.btn-proj:hover{background:var(--ws4)}
.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:94%;max-width:520px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-hdr{background:var(--ws2);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.modal-hdr h2{font-size:15px;font-weight:700;margin:0}
.modal-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;padding:0 4px}.modal-close:hover{color:#fff}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.proj-save{display:flex;gap:8px;margin-bottom:16px}
.proj-save input{flex:1;text-align:left;font-size:13px;padding:9px 12px}
.proj-save button{white-space:nowrap}
.proj-list{list-style:none;padding:0}
.proj-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.proj-item:hover{border-color:var(--ws);background:var(--ws4)}
.proj-item .pi-name{flex:1;font-weight:600;font-size:13px;color:var(--text)}
.proj-item .pi-date{font-size:10px;color:var(--text3)}
.proj-item .pi-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}.proj-item .pi-del:hover{color:var(--red);background:#fef2f2}
.proj-empty{text-align:center;color:var(--text3);padding:24px;font-size:13px}
.proj-io{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;gap:8px}
.proj-io button{flex:1}
@media(max-width:700px){.hdr-proj{grid-template-columns:1fr}.config-bar{flex-direction:column;align-items:stretch}.grand-tot{flex-direction:column;text-align:center}.gt-sep{width:60px;height:1px}table{font-size:11px}.brand-bar{flex-direction:column;align-items:flex-start}}
</style>
</head>

<path d="M917.495 90.0776C915.108 90.0776 912.967 89.5282 911.073 88.4293C909.178 87.3304 907.662 85.8337 906.526 83.939C905.427 82.0444 904.877 79.9224 904.877 77.5731C904.877 75.2237 905.427 73.1018 906.526 71.2071C907.662 69.3125 909.178 67.8157 911.073 66.7169C913.005 65.618 915.146 65.0685 917.495 65.0685C919.883 65.0685 922.023 65.618 923.918 66.7169C925.813 67.7779 927.291 69.2557 928.352 71.1503C929.45 73.0449 930 75.1858 930 77.5731C930 79.9603 929.45 82.1012 928.352 83.9959C927.291 85.8526 925.813 87.3304 923.918 88.4293C922.023 89.5282 919.883 90.0776 917.495 90.0776ZM917.495 87.6904C919.428 87.6904 921.133 87.2546 922.611 86.3831C924.127 85.5116 925.301 84.3179 926.135 82.8022C927.006 81.2487 927.442 79.5056 927.442 77.5731C927.442 75.6027 927.006 73.8596 926.135 72.3439C925.301 70.8282 924.127 69.6346 922.611 68.7631C921.133 67.8915 919.428 67.4558 917.495 67.4558C915.563 67.4558 913.839 67.9105 912.323 68.8199C910.807 69.6914 909.614 70.885 908.742 72.4007C907.871 73.9164 907.435 75.6406 907.435 77.5731C907.435 79.5056 907.871 81.2487 908.742 82.8022C909.614 84.3179 910.807 85.5116 912.323 86.3831C913.839 87.2546 915.563 87.6904 917.495 87.6904ZM914.824 84.4506H912.266V70.2977H918.177C919.769 70.2977 921.038 70.6766 921.986 71.4345C922.971 72.1923 923.463 73.2344 923.463 74.5606C923.463 75.5079 923.198 76.3605 922.668 77.1184C922.175 77.8383 921.493 78.3878 920.621 78.7667L923.634 84.4506H920.849L918.291 79.4488H914.824V84.4506ZM920.735 74.8448C920.735 73.4428 919.864 72.7418 918.121 72.7418H914.824V77.1184H918.121C918.954 77.1184 919.598 76.91 920.053 76.4931C920.508 76.0763 920.735 75.5269 920.735 74.8448Z" fill="white"/>
    </svg>

<script>
"use strict";

var PROFILES = {
  influence: {name:"Clipper Influence", aisL:18, aisH:20, descL:"9+9 mm", descH:"10+10 mm"},
  elance:    {name:"Clipper \u00c9lance",  aisL:24, aisH:30, descL:"12+12 mm", descH:"15+15 mm"},
  osmose:    {name:"Qovans Osmose",     aisL:16, aisH:25, descL:"8+8 mm",   descH:"12.5+12.5 mm"}
};

var uid = 0;
function gid() { return "u" + (++uid); }
function mkG(i, h) { return {id:gid(), idx:i, hautCDV:h||0, showComment:false, comment:""}; }
function mkC(n) { return {id:gid(), num:String(n), desc:"", largCDV:0, hautMoy:0, vitrage:"double", ep1:10, ep2:12, glasses:[mkG(1,0)]}; }
function mkZ(n, nm, d) { return {id:gid(), name:nm||"ZONE "+n, desc:d||"", cloisons:[mkC(1)]}; }

var zones = [mkZ(1, "ZONE 1", "")];

function getP() {
  var pr = PROFILES[document.getElementById("cfgProfile").value] || PROFILES.influence;
  return {aisL:pr.aisL, aisH:pr.aisH, joint:+document.getElementById("cfgJoint").value||2, maxL:+document.getElementById("cfgMaxL").value||1200, profile:pr};
}

function onProfileChange() { updateInfo(); render(); }

function updateInfo() {
  var pr = PROFILES[document.getElementById("cfgProfile").value] || PROFILES.influence;
  document.getElementById("cfgInfo").innerHTML = `<span>Aisance L : ${pr.aisL} mm (${pr.descL})</span><span>Aisance H : ${pr.aisH} mm (${pr.descH})</span>`;
}

function cNb(w, mx, j) { if (!w || w <= 0) return 1; var n = 1; while ((w - (n-1)*j) / n > mx) n++; return n; }
function cLV(w, nb, j, a) { if (!w || !nb) return 0; return Math.round(((w - (nb-1)*j + a) / nb) * 10) / 10; }
function cHV(h, a) { return (h||0) + a; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function chgL(zi, ci, v) { var p = getP(), c = zones[zi].cloisons[ci]; c.largCDV = v; var nb = cNb(v, p.maxL, p.joint), ng = []; for (var i = 0; i < nb; i++) ng.push(c.glasses[i] ? {id:c.glasses[i].id, idx:i+1, hautCDV:c.glasses[i].hautCDV, showComment:c.glasses[i].showComment||false, comment:c.glasses[i].comment||""} : mkG(i+1, c.hautMoy)); c.glasses = ng; render(); }
function chgNb(zi, ci, v) { var c = zones[zi].cloisons[ci], nb = Math.max(1, v), ng = []; for (var i = 0; i < nb; i++) ng.push(c.glasses[i] ? {id:c.glasses[i].id, idx:i+1, hautCDV:c.glasses[i].hautCDV, showComment:c.glasses[i].showComment||false, comment:c.glasses[i].comment||""} : mkG(i+1, c.hautMoy)); c.glasses = ng; render(); }
function chgH(zi, ci, gi, v) { var c = zones[zi].cloisons[ci]; if (gi === 0) { c.hautMoy = v; for (var i = 0; i < c.glasses.length; i++) c.glasses[i].hautCDV = v; } else { c.glasses[gi].hautCDV = v; } render(); }
function chgT(zi, ci, v) { zones[zi].cloisons[ci].vitrage = v; render(); }
function chgE1(zi, ci, v) { zones[zi].cloisons[ci].ep1 = +v; render(); }
function chgE2(zi, ci, v) { zones[zi].cloisons[ci].ep2 = +v; render(); }
function togCom(zi, ci, gi) { zones[zi].cloisons[ci].glasses[gi].showComment = !zones[zi].cloisons[ci].glasses[gi].showComment; render(); }
function chgCom(zi, ci, gi, v) { zones[zi].cloisons[ci].glasses[gi].comment = v; }
function addC(zi) { zones[zi].cloisons.push(mkC(zones[zi].cloisons.length + 1)); render(); }
function remC(zi, ci) { zones[zi].cloisons.splice(ci, 1); render(); }
function addZ() { zones.push(mkZ(zones.length + 1)); render(); }
function remZ(zi) { zones.splice(zi, 1); render(); }
function sOp(vs, sel) { return vs.map(function(v) { return `<option value="${v}" ${v === sel ? "selected" : ""}>${v}</option>`; }).join(""); }

function hWarn(c, gi, zH) {
  var g = c.glasses[gi];
  if (!g.hautCDV) return {c:"", t:""};

  var h = g.hautCDV, m = [], lv = 0;

  // Limites absolues
  if (h < 200) { m.push("Tr\u00e8s faible (&lt;200mm)"); lv = 2; }
  else if (h < 400) { m.push("Inhabituelle (&lt;400mm)"); lv = 1; }

  if (h > 3500) { m.push("Tr\u00e8s \u00e9lev\u00e9e (&gt;3500mm)"); lv = 2; }
  else if (h > 3000) { m.push("\u00c9lev\u00e9e (&gt;3000mm)"); lv = Math.max(lv, 1); }

  // Comparaison inter-cloison
  if (c.glasses.length > 1) {
    var ot = [], i;
    for (i = 0; i < c.glasses.length; i++) { if (i !== gi && c.glasses[i].hautCDV) ot.push(c.glasses[i].hautCDV); }
    if (ot.length > 0) {
      var av = 0; for (i = 0; i < ot.length; i++) av += ot[i]; av /= ot.length;
      var df = Math.abs(h - av);
      if (df > 200) { m.push("\u00c9cart &gt;200mm vs cloison"); lv = 2; }
      else if (df > 80) { m.push("\u00c9cart &gt;80mm vs cloison"); lv = Math.max(lv, 1); }
    }
  }

  // Comparaison inter-zone
  if (zH.length > 1) {
    var za = 0, j; for (j = 0; j < zH.length; j++) za += zH[j]; za /= zH.length;
    var zd = Math.abs(h - za), pc = za > 0 ? (zd / za) * 100 : 0;
    if (pc > 30) { m.push(`\u00c9cart &gt;30% vs zone (${Math.round(za)}mm)`); lv = Math.max(lv, 1); }
  }

  if (m.length === 0) return {c:"", t:""};

  var cls = lv >= 2 ? "inp-herr" : "inp-hwarn";
  var tc = lv >= 2 ? "warn-tip err" : "warn-tip";

  return {
    c: ` ${cls}`,
    t: `<div class="${tc}">${m.join("<br>")}</div>`
  };
}

function render() {
  var p = getP(), h = "", tQ8 = 0, tQ10 = 0, tQ12 = 0, tSurf = 0;

  for (var zi = 0; zi < zones.length; zi++) {
    var z = zones[zi], zQ8 = 0, zQ10 = 0, zQ12 = 0, zSurf = 0;

    // Calcul de la hauteur moyenne de la zone pour les warnings
    var zH = [];
    for (var _c = 0; _c < z.cloisons.length; _c++) {
      for (var _g = 0; _g < z.cloisons[_c].glasses.length; _g++) {
        if (z.cloisons[_c].glasses[_g].hautCDV) zH.push(z.cloisons[_c].glasses[_g].hautCDV);
      }
    }

    h += `
      <div class="zone">
        <div class="zone-hdr">
          <div class="zbar"></div>
          <input type="text" class="zname" value="${esc(z.name)}" onchange="zones[${zi}].name=this.value">
          <span class="zsep">&#8212;</span>
          <input type="text" class="zdesc" value="${esc(z.desc)}" placeholder="Description zone..." onchange="zones[${zi}].desc=this.value">
          <button class="zbtn" onclick="addC(${zi})">+ Cloison</button>
          ${zones.length > 1 ? `<button class="zbtn zdel" onclick="remZ(${zi})">&#10005; Zone</button>` : ''}
        </div>
        <div class="zone-body">
          <div class="tbl">
            <table>
              <thead>
                <tr>
                  <th style="width:36px">N&#176;</th>
                  <th style="min-width:150px">Description</th>
                  <th style="width:54px">Type</th>
                  <th style="width:120px">&#201;paisseurs</th>
                  <th style="width:90px">Larg. CDV</th>
                  <th style="width:50px">Nb</th>
                  <th style="width:34px">N&#176;v</th>
                  <th style="width:90px">Haut. CDV</th>
                  <th style="width:100px">Larg. cmd</th>
                  <th style="width:100px">Haut. cmd</th>
                  <th style="width:40px">8mm</th>
                  <th style="width:40px">10mm</th>
                  <th style="width:40px">12mm</th>
                  <th style="width:78px">Surf. m&#178;</th>
                  <th style="width:30px">&#128172;</th>
                  <th style="width:30px"></th>
                </tr>
              </thead>
              <tbody>
    `;

    for (var ci = 0; ci < z.cloisons.length; ci++) {
      var c = z.cloisons[ci], nb = c.glasses.length, lv = cLV(c.largCDV, nb, p.joint, p.aisL), warn = lv > p.maxL;
      var dv = c.vitrage === "double", npanes = dv ? 2 : 1;
      var q8 = (c.ep1 === 8 ? 1 : 0) + (dv && c.ep2 === 8 ? 1 : 0);
      var q10 = (c.ep1 === 10 ? 1 : 0) + (dv && c.ep2 === 10 ? 1 : 0);
      var q12 = (c.ep1 === 12 ? 1 : 0) + (dv && c.ep2 === 12 ? 1 : 0);

      // Calcul rowspan : nb vitrages + nb lignes commentaires visibles
      var nCom = 0;
      for (var _i = 0; _i < c.glasses.length; _i++) { if (c.glasses[_i].showComment) nCom++; }
      var rs = nb + nCom;

      for (var gi = 0; gi < c.glasses.length; gi++) {
        var g = c.glasses[gi], hv = cHV(g.hautCDV, p.aisH);
        var surf = (c.largCDV && g.hautCDV) ? Math.round((lv * hv / 1e6) * npanes * 1000) / 1000 : 0;
        zQ8 += q8; zQ10 += q10; zQ12 += q12; zSurf += surf;

        h += `<tr ${gi === 0 ? 'class="row-first"' : ''}>`;

        if (gi === 0) {
          h += `
            <td style="text-align:center;font-weight:700;color:var(--ws2)" rowspan="${rs}">${esc(c.num)}</td>
            <td rowspan="${rs}">
              <div style="display:flex;gap:4px">
                <input type="text" value="${esc(c.num)}" style="width:36px;text-align:center;font-weight:600" onchange="zones[${zi}].cloisons[${ci}].num=this.value;render()">
                <input type="text" value="${esc(c.desc)}" placeholder="Description..." style="flex:1" onchange="zones[${zi}].cloisons[${ci}].desc=this.value">
              </div>
            </td>
            <td rowspan="${rs}">
              <select style="font-weight:600;color:${dv ? 'var(--ws)' : 'var(--orange)'}" onchange="chgT(${zi},${ci},this.value)">
                <option value="double" ${dv ? 'selected' : ''}>DV</option>
                <option value="simple" ${!dv ? 'selected' : ''}>SV</option>
              </select>
            </td>
            <td rowspan="${rs}">
              <div style="display:flex;gap:4px;align-items:center">
                <select style="min-width:54px" onchange="chgE1(${zi},${ci},this.value)">${sOp([8,10,12], c.ep1)}</select>
                ${dv ? `<span style="color:var(--text3);font-size:13px;font-weight:700;flex-shrink:0">+</span><select style="min-width:54px" onchange="chgE2(${zi},${ci},this.value)">${sOp([8,10,12], c.ep2)}</select>` : ''}
              </div>
            </td>
            <td rowspan="${rs}"><input type="number" class="inp-green" value="${c.largCDV || ''}" placeholder="mm" onchange="chgL(${zi},${ci},+this.value)"></td>
            <td rowspan="${rs}"><input type="number" value="${nb}" min="1" style="text-align:center;font-weight:600" onchange="chgNb(${zi},${ci},+this.value)"></td>
          `;
        }

        var hw = hWarn(c, gi, zH);

        h += `
            <td style="text-align:center;font-size:11px;color:var(--text3);font-weight:500">${g.idx}</td>
            <td>
              <input type="number" class="inp-green${hw.c}" value="${g.hautCDV || ''}" placeholder="mm" onchange="chgH(${zi},${ci},${gi},+this.value)">
              ${hw.t}
            </td>
            <td><div class="calc-cell ${warn ? 'calc-warn' : ''}">${c.largCDV ? lv.toFixed(1) : '&#8212;'}</div></td>
            <td><div class="calc-cell">${g.hautCDV ? hv : '&#8212;'}</div></td>
            <td style="text-align:center;font-weight:700;color:${q8 ? 'var(--text)' : 'var(--border)'}">${q8 || ''}</td>
            <td style="text-align:center;font-weight:700;color:${q10 ? 'var(--text)' : 'var(--border)'}">${q10 || ''}</td>
            <td style="text-align:center;font-weight:700;color:${q12 ? 'var(--text)' : 'var(--border)'}">${q12 || ''}</td>
            <td style="text-align:right;font-size:12px;color:var(--text2);font-weight:500">${surf ? surf.toFixed(3) : '&#8212;'}</td>
            <td style="text-align:center"><input type="checkbox" class="com-chk" ${g.showComment ? 'checked' : ''} onchange="togCom(${zi},${ci},${gi})"></td>
        `;

        if (gi === 0) {
          h += `<td rowspan="${rs}" style="text-align:center">`;
          if (z.cloisons.length > 1) {
            h += `<button class="btn btn-d" style="padding:3px 7px" onclick="remC(${zi},${ci})">&#10005;</button>`;
          }
          h += `</td>`;
        }

        h += `</tr>`;

        // Ligne commentaire si checkbox cochée
        if (g.showComment) {
          h += `<tr class="com-row">
            <td colspan="9" style="padding-left:8px!important">
              <div style="display:flex;align-items:center">
                <span class="com-label">&#128172; V${g.idx} :</span>
                <input type="text" class="com-inp" value="${esc(g.comment||'')}" placeholder="Commentaire pour ce vitrage..." onchange="chgCom(${zi},${ci},${gi},this.value)">
              </div>
            </td>
          </tr>`;
        }
      }
    }

    h += `
              </tbody>
            </table>
          </div>
        </div>
        <div class="zone-tot">
          <span class="lbl">Total ${esc(z.name)}</span>
          ${zQ8 ? `<span class="val">${zQ8}&#215;8mm</span>` : ''}
          ${zQ10 ? `<span class="val">${zQ10}&#215;10mm</span>` : ''}
          ${zQ12 ? `<span class="val">${zQ12}&#215;12mm</span>` : ''}
          <span class="val" style="font-size:13px">${zSurf.toFixed(3)} m&#178;</span>
        </div>
      </div>
    `;

    tQ8 += zQ8; tQ10 += zQ10; tQ12 += zQ12; tSurf += zSurf;
  }

  h += `
    <button class="btn btn-ws" style="margin:12px 0 20px" onclick="addZ()">+ Ajouter une zone</button>
    <div class="grand-tot">
      <div class="gt-title">TOTAL G&#201;N&#201;RAL</div>
      ${tQ8 ? `<div class="gt-item"><div class="gt-label">Pi&#232;ces 8mm</div><div class="gt-val">${tQ8}</div></div>` : ''}
      ${tQ10 ? `<div class="gt-item"><div class="gt-label">Pi&#232;ces 10mm</div><div class="gt-val">${tQ10}</div></div>` : ''}
      ${tQ12 ? `<div class="gt-item"><div class="gt-label">Pi&#232;ces 12mm</div><div class="gt-val">${tQ12}</div></div>` : ''}
      <div class="gt-sep"></div>
      <div class="gt-item"><div class="gt-label">Total pi&#232;ces</div><div class="gt-val">${tQ8 + tQ10 + tQ12}</div></div>
      <div class="gt-item"><div class="gt-label">Surface totale</div><div class="gt-val">${tSurf.toFixed(3)} <span class="gt-unit">m&#178;</span></div></div>
    </div>
  `;

  document.getElementById("main").innerHTML = h;
}

function exportCSV() {
  var p = getP(), sep = ";", lines = [];
  function e(v) { var s = String(v == null ? "" : v); return (s.indexOf(sep) >= 0 || s.indexOf('"') >= 0 || s.indexOf("\n") >= 0) ? `"${s.replace(/"/g, '""')}"` : s; }
  function row() { var a = []; for (var i = 0; i < arguments.length; i++) a.push(e(arguments[i])); lines.push(a.join(sep)); }

  row(`COMMANDE VITRAGES - ${p.profile.name.toUpperCase()} - WORKSPHERE`);
  row(`Projet : ${document.getElementById("projName").value}`);
  row(`Adresse : ${document.getElementById("projAddr").value}`);
  row(`Date : ${new Date().toLocaleDateString("fr-BE")}`);
  row();
  row(`Profil: ${p.profile.name}`, `Aisance L:${p.aisL}mm`, `Aisance H:${p.aisH}mm`, `Joint:${p.joint}mm`, `Max L:${p.maxL}mm`);
  row();

  var gQ8 = 0, gQ10 = 0, gQ12 = 0;

  for (var zi = 0; zi < zones.length; zi++) {
    var z = zones[zi];
    row(`${z.name}${z.desc ? ` - ${z.desc}` : ""}`);
    row("N", "Desc", "Type", "Ep", "Larg CDV", "Nb", "Nv", "Haut CDV", "Larg cmd", "Haut cmd", "8mm", "10mm", "12mm", "Surf m2", "Commentaire");

    var zQ8 = 0, zQ10 = 0, zQ12 = 0, zS = 0;

    for (var ci = 0; ci < z.cloisons.length; ci++) {
      var c = z.cloisons[ci], nb = c.glasses.length, lv = cLV(c.largCDV, nb, p.joint, p.aisL);
      var dv = c.vitrage === "double", np = dv ? 2 : 1;
      var q8 = (c.ep1 === 8 ? 1 : 0) + (dv && c.ep2 === 8 ? 1 : 0);
      var q10 = (c.ep1 === 10 ? 1 : 0) + (dv && c.ep2 === 10 ? 1 : 0);
      var q12 = (c.ep1 === 12 ? 1 : 0) + (dv && c.ep2 === 12 ? 1 : 0);

      for (var gi = 0; gi < c.glasses.length; gi++) {
        var g = c.glasses[gi], hv = cHV(g.hautCDV, p.aisH), surf = Math.round((lv * hv / 1e6) * np * 1000) / 1000;
        row(
          gi === 0 ? c.num : "",
          gi === 0 ? c.desc : "",
          gi === 0 ? (dv ? "DV" : "SV") : "",
          gi === 0 ? (dv ? `${c.ep1}+${c.ep2}` : c.ep1) : "",
          gi === 0 ? c.largCDV : "",
          gi === 0 ? nb : "",
          g.idx, g.hautCDV, lv, hv, q8, q10, q12, surf, g.comment||""
        );
        zQ8 += q8; zQ10 += q10; zQ12 += q12; zS += surf;
      }
    }
    row("", "", "", "", "", "", "", `Total ${z.name}`, "", "", zQ8, zQ10, zQ12, Math.round(zS * 1000) / 1000);
    row();
    gQ8 += zQ8; gQ10 += zQ10; gQ12 += zQ12;
  }
  row("", "", "", "", "", "", "", "TOTAL", "", "", gQ8, gQ10, gQ12, "");

  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Commande_Worksphere_${document.getElementById("projName").value.replace(/[^a-zA-Z0-9]/g, "_")}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportPDF() {
  try {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert("Biblioth\u00e8que PDF en cours de chargement. V\u00e9rifiez votre connexion internet et rechargez la page.");
      return;
    }

    var doc = new window.jspdf.jsPDF({orientation:"landscape", unit:"mm", format:"a4"});

    if (typeof doc.autoTable !== "function") {
      alert("Plugin table non disponible, rechargez la page.");
      return;
    }

    var p = getP(), W = 297, H = 210, mx = 10, y = 12;

    // Palette centralis\u00e9e
    var cBrand = [26, 82, 82];
    var cZone  = [43, 110, 110];
    var cDark  = [26, 46, 46];
    var cGray  = [80, 100, 100];
    var cLight = [200, 220, 220];
    var cWhite = [255, 255, 255];
    var cTotBg = [238, 241, 241];
    var cHl    = [232, 244, 244];

    var projN = document.getElementById("projName").value;
    var projA = document.getElementById("projAddr").value;
    var ds = new Date().toLocaleDateString("fr-BE");

    // Helper d'\u00e9criture propre
    function writeTxt(txt, x, y, size, weight, color, align) {
      doc.setFontSize(size);
      doc.setFont("helvetica", weight);
      doc.setTextColor.apply(doc, color);
      doc.text(txt, x, y, align ? {align: align} : undefined);
    }

    doc.setFillColor.apply(doc, cBrand);
    doc.rect(0, 0, W, 22, "F");
    if (logoPNG) {
      try { doc.addImage(logoPNG, "PNG", mx, 4, 56, 11.75); } catch(e) {}
    }
    writeTxt("Calculateur de commande vitrages", W - mx, 10, 9, "normal", cLight, "right");
    writeTxt(ds, W - mx, 17, 8, "normal", cWhite, "right");

    y = 28;
    writeTxt(`Projet : ${projN}`, mx, y, 10, "bold", cDark);
    writeTxt(`Adresse : ${projA}`, mx + 120, y, 10, "bold", cDark);
    y += 5;
    writeTxt(`Profil: ${p.profile.name}  |  Aisance L: ${p.aisL}mm (${p.profile.descL})  |  Aisance H: ${p.aisH}mm (${p.profile.descH})  |  Joint: ${p.joint}mm  |  Max: ${p.maxL}mm`, mx, y, 9, "normal", cGray);
    y += 8;

    var gQ8 = 0, gQ10 = 0, gQ12 = 0, gSurf = 0;

    for (var zi = 0; zi < zones.length; zi++) {
      var z = zones[zi];
      if (y > H - 40) { doc.addPage(); y = 12; }

      doc.setFillColor.apply(doc, cZone);
      doc.rect(mx, y, W - 2 * mx, 7, "F");
      writeTxt(`${z.name}${z.desc ? ` \u2014 ${z.desc}` : ""}`, mx + 3, y + 5, 9, "bold", cWhite);
      y += 9;

      var rows = [];
      var zQ8 = 0, zQ10 = 0, zQ12 = 0, zS = 0;

      for (var ci = 0; ci < z.cloisons.length; ci++) {
        var c = z.cloisons[ci], nb = c.glasses.length, lv = cLV(c.largCDV, nb, p.joint, p.aisL);
        var dv = c.vitrage === "double", np = dv ? 2 : 1;
        var q8 = (c.ep1 === 8 ? 1 : 0) + (dv && c.ep2 === 8 ? 1 : 0);
        var q10 = (c.ep1 === 10 ? 1 : 0) + (dv && c.ep2 === 10 ? 1 : 0);
        var q12 = (c.ep1 === 12 ? 1 : 0) + (dv && c.ep2 === 12 ? 1 : 0);
        var epL = dv ? `${c.ep1}+${c.ep2}` : `${c.ep1}`;

        for (var gi = 0; gi < c.glasses.length; gi++) {
          var g = c.glasses[gi], hv = cHV(g.hautCDV, p.aisH);
          var surf = (c.largCDV && g.hautCDV) ? Math.round((lv * hv / 1e6) * np * 1000) / 1000 : 0;

          rows.push([
            gi === 0 ? `${c.num}` : "",
            gi === 0 ? c.desc : "",
            gi === 0 ? (dv ? "DV" : "SV") : "",
            gi === 0 ? epL : "",
            gi === 0 && c.largCDV ? `${c.largCDV}` : "",
            gi === 0 ? `${nb}` : "",
            `${g.idx}`,
            g.hautCDV ? `${g.hautCDV}` : "",
            c.largCDV ? lv.toFixed(1) : "",
            g.hautCDV ? `${hv}` : "",
            q8 ? `${q8}` : "",
            q10 ? `${q10}` : "",
            q12 ? `${q12}` : "",
            surf ? surf.toFixed(3) : "",
            g.comment || ""
          ]);
          zQ8 += q8; zQ10 += q10; zQ12 += q12; zS += surf;
        }
      }

      var tableEndY = y;
      doc.autoTable({
        startY: y,
        margin: {left:mx, right:mx},
        head: [["N\u00b0", "Description", "Type", "\u00c9p.", "Larg CDV", "Nb", "N\u00b0v", "Haut CDV", "Larg cmd", "Haut cmd", "8mm", "10mm", "12mm", "Surf m\u00b2", "Commentaire"]],
        body: rows,
        theme: "grid",
        styles: {fontSize:7.5, cellPadding:1.5, lineColor:[220,226,226], lineWidth:0.2, font:"helvetica"},
        headStyles: {fillColor:cZone, textColor:cWhite, fontStyle:"bold", halign:"center", fontSize:7},
        columnStyles: {
          0:{halign:"center", cellWidth:10},
          1:{cellWidth:30},
          2:{halign:"center", cellWidth:10},
          3:{halign:"center", cellWidth:13},
          4:{halign:"right", cellWidth:18},
          5:{halign:"center", cellWidth:9},
          6:{halign:"center", cellWidth:9},
          7:{halign:"right", cellWidth:18},
          8:{halign:"right", cellWidth:20, textColor:cBrand, fontStyle:"bold"},
          9:{halign:"right", cellWidth:20, textColor:cBrand, fontStyle:"bold"},
          10:{halign:"center", cellWidth:10},
          11:{halign:"center", cellWidth:10},
          12:{halign:"center", cellWidth:10},
          13:{halign:"right", cellWidth:16},
          14:{cellWidth:30, fontSize:6.5, fontStyle:"italic", textColor:cGray}
        },
        didParseCell: function(d) {
          if (d.section === "body" && (d.column.index === 8 || d.column.index === 9)) {
            d.cell.styles.fillColor = cHl;
          }
        },
        didDrawPage: function(d) { tableEndY = d.cursor.y; }
      });

      y = tableEndY + 2;

      doc.setFillColor.apply(doc, cTotBg);
      doc.rect(mx, y, W - 2 * mx, 6, "F");
      var zt = `Total ${z.name} :`;
      if (zQ8) zt += `  ${zQ8}x8mm`;
      if (zQ10) zt += `  ${zQ10}x10mm`;
      if (zQ12) zt += `  ${zQ12}x12mm`;
      zt += `  |  ${zS.toFixed(3)} m\u00b2`;
      writeTxt(zt, W - mx - 2, y + 4, 8, "bold", cZone, "right");

      y += 10;
      gQ8 += zQ8; gQ10 += zQ10; gQ12 += zQ12; gSurf += zS;
    }

    if (y > H - 22) { doc.addPage(); y = 12; }
    doc.setFillColor.apply(doc, cBrand);
    doc.rect(mx, y, W - 2 * mx, 16, "F");
    writeTxt("TOTAL G\u00c9N\u00c9RAL", mx + 4, y + 10, 11, "bold", cWhite);

    var tx = mx + 70;
    function gI(lb, vl, x) {
      writeTxt(lb, x, y + 5, 7, "normal", cWhite);
      writeTxt(`${vl}`, x, y + 12, 12, "bold", cWhite);
    }
    if (gQ8) { gI("Pi\u00e8ces 8mm", gQ8, tx); tx += 38; }
    if (gQ10) { gI("Pi\u00e8ces 10mm", gQ10, tx); tx += 38; }
    if (gQ12) { gI("Pi\u00e8ces 12mm", gQ12, tx); tx += 38; }
    tx += 5;
    gI("Total pi\u00e8ces", gQ8 + gQ10 + gQ12, tx); tx += 38;
    gI("Surface totale", `${gSurf.toFixed(3)} m\u00b2`, tx);

    var pC = doc.getNumberOfPages();
    for (var pg = 1; pg <= pC; pg++) {
      doc.setPage(pg);
      writeTxt("worksphere \u2014 Avenue Lavoisier 9, 1300 Wavre \u2014 hello@worksphere.be \u2014 +32 2 318 36 01", mx, H - 5, 7, "normal", cGray);
      writeTxt(`Page ${pg}/${pC}`, W - mx, H - 5, 7, "normal", cGray, "right");
    }

    doc.save(`Commande_Worksphere_${projN.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
  } catch (err) {
    alert(`Erreur PDF: ${err.message}`);
    console.error("PDF export error:", err);
  }
}

// === LOGIQUE DE SAUVEGARDE ET PROJETS ===

var PROJ_KEY = "ws_projects";

function getState() {
  return {
    projName: document.getElementById("projName").value,
    projAddr: document.getElementById("projAddr").value,
    profile: document.getElementById("cfgProfile").value,
    joint: document.getElementById("cfgJoint").value,
    maxL: document.getElementById("cfgMaxL").value,
    zones: zones
  };
}

function loadState(st) {
  document.getElementById("projName").value = st.projName || "";
  document.getElementById("projAddr").value = st.projAddr || "";
  if (st.profile) document.getElementById("cfgProfile").value = st.profile;
  if (st.joint) document.getElementById("cfgJoint").value = st.joint;
  if (st.maxL) document.getElementById("cfgMaxL").value = st.maxL;
  zones = st.zones || [mkZ(1, "ZONE 1", "")];
  uid = 0;

  function reId(arr) {
    for (var i = 0; i < arr.length; i++) {
      arr[i].id = gid();
      if (arr[i].cloisons) reId(arr[i].cloisons);
      if (arr[i].glasses) reId(arr[i].glasses);
    }
  }
  reId(zones);

  updateInfo();
  render();
}

function getSavedProjects() {
  try { return JSON.parse(localStorage.getItem(PROJ_KEY)) || []; }
  catch(e) { return []; }
}

function saveProjList(list) {
  localStorage.setItem(PROJ_KEY, JSON.stringify(list));
}

function openProj() {
  document.getElementById("projSaveName").value = document.getElementById("projName").value;
  renderProjList();
  document.getElementById("projModal").classList.add("open");
}

function closeProj() {
  document.getElementById("projModal").classList.remove("open");
}

function renderProjList() {
  var list = getSavedProjects();
  var el = document.getElementById("projList");

  if (list.length === 0) {
    el.innerHTML = `<li class="proj-empty">Aucun projet sauvegard\u00e9</li>`;
    return;
  }

  var h = "";
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    var d = p.date ? `${new Date(p.date).toLocaleDateString("fr-BE")} ${new Date(p.date).toLocaleTimeString("fr-BE", {hour:"2-digit", minute:"2-digit"})}` : "";
    var nz = p.data && p.data.zones ? p.data.zones.length : 0;
    var nc = 0;

    if (p.data && p.data.zones) {
      for (var j = 0; j < p.data.zones.length; j++) {
        nc += p.data.zones[j].cloisons ? p.data.zones[j].cloisons.length : 0;
      }
    }

    h += `
      <li class="proj-item" onclick="loadProj(${i})">
        <span class="pi-name">${esc(p.name)}</span>
        <span class="pi-date">${nz}z / ${nc}c &middot; ${d}</span>
        <button class="pi-del" onclick="event.stopPropagation();delProj(${i})" title="Supprimer">&#128465;</button>
      </li>
    `;
  }
  el.innerHTML = h;
}

function saveProj() {
  var name = document.getElementById("projSaveName").value.trim();
  if (!name) { alert("Entrez un nom de projet"); return; }

  var list = getSavedProjects();
  var existing = -1;
  for (var i = 0; i < list.length; i++) {
    if (list[i].name === name) { existing = i; break; }
  }

  var entry = {name: name, date: new Date().toISOString(), data: getState()};

  if (existing >= 0) {
    list[existing] = entry;
  } else {
    list.unshift(entry);
  }

  saveProjList(list);
  renderProjList();
  document.getElementById("projName").value = name;
}

function loadProj(idx) {
  var list = getSavedProjects();
  if (!list[idx]) return;
  loadState(list[idx].data);
  closeProj();
}

function delProj(idx) {
  var list = getSavedProjects();
  if (!list[idx]) return;
  if (!confirm(`Supprimer le projet "${list[idx].name}" ?`)) return;
  list.splice(idx, 1);
  saveProjList(list);
  renderProjList();
}

function exportProjJSON() {
  var state = getState();
  var name = document.getElementById("projSaveName").value.trim() || document.getElementById("projName").value || "projet";
  var data = {name: name, date: new Date().toISOString(), data: state};

  var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Worksphere_${name.replace(/[^a-zA-Z0-9]/g, "_")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importProjJSON(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();

  reader.onload = function(e) {
    try {
      var obj = JSON.parse(e.target.result);
      if (obj.data && obj.data.zones) {
        loadState(obj.data);
        closeProj();
      } else {
        alert("Fichier JSON invalide");
      }
    } catch(err) {
      alert(`Erreur lecture JSON: ${err.message}`);
    }
  };
  reader.readAsText(file);
  evt.target.value = "";
}

var logoPNG = "";
(function preRenderLogo() {
  var svgStr = '<svg xmlns="http://www.w3.org/2000/svg" width="930" height="195" viewBox="0 0 930 195" fill="none">'
    + document.querySelector(".brand-logo").innerHTML
    + '</svg>';
  var blob = new Blob([svgStr], {type:"image/svg+xml;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() {
    var c = document.createElement("canvas");
    c.width = 930; c.height = 195;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#1a5252";
    ctx.fillRect(0, 0, 930, 195);
    ctx.drawImage(img, 0, 0);
    logoPNG = c.toDataURL("image/png");
    URL.revokeObjectURL(url);
  };
  img.src = url;
})();

updateInfo();
render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(function(reg) {
    reg.update();
  }).catch(function(e) {
    console.log("SW registration failed: ", e);
  });
}
</script>
